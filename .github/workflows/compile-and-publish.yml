name: Sync Google Docs, Compile LaTeX PDFs & Publish Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies & Pandoc
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install beautifulsoup4 pypandoc vaderSentiment pandas numpy

      - name: Sync linked Google Docs (0-token deterministic repair)
        run: |
          python -B -m site_content.log_sync || true

      - name: Build portfolio site
        run: |
          python -B -m site_content.build --also-local
