   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183047" x="36.936" y="43.950013" transform="rotate(-0 36.936 43.950013)">SHOOTING / HIGH JUMP RULES</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="72.875313" transform="rotate(-0 36.936 72.875313)">Unlimited offers do not mean an obligation to accept</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="481.024238" transform="rotate(-0 36.936 481.024238)">FIRST TO FOUR  /  Original house-rule illustration  /  Schematic, not official court dimensions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="164.16" y="142.50453" transform="rotate(-0 164.16 142.50453)">BOTH FAIL</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(90.188438 174.96773)">Agree any mutual amount;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(126.149844 189.374895)">two is typical.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="432" y="142.50453" transform="rotate(-0 432 142.50453)">HONOR SYSTEM</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(360.280859 174.96773)">Accept a mercy or decline</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(372.153984 189.374895)">if the game feels lost.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="699.84" y="142.50453" transform="rotate(-0 699.84 142.50453)">NO MERCIES LEFT</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(623.48625 174.96773)">HIGH JUMP RULES: previous</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(635.878438 189.374895)">successful shot counts.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #536775" x="237.816" y="271.87125" transform="rotate(-0 237.816 271.87125)">Illustration, not a recorded game</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="97.2" y="311.891188" transform="rotate(-0 97.2 311.891188)">A</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="304.776" y="311.61525" transform="rotate(-0 304.776 311.61525)">1 attempt</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="97.2" y="358.259188" transform="rotate(-0 97.2 358.259188)">B</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="304.776" y="357.98325" transform="rotate(-0 304.776 357.98325)">3 attempts</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="612.792" y="289.68981" transform="rotate(-0 612.792 289.68981)">FEWER ATTEMPTS WINS</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(524.584031 320.116148)">Example: A wins the countback.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(525.997703 334.523313)">Tied? Compare the shot before,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(505.804109 348.930477)">back to the first; then SUDDEN DEATH.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="432" y="440.507313" transform="rotate(-0 432 440.507313)">Why HIGH JUMP RULES? Both creators competed in high jump; this is their owner-supplied rule.</text>
   </g>
