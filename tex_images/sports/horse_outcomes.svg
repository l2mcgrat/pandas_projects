   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183047" x="36.936" y="43.950013" transform="rotate(-0 36.936 43.950013)">HORSE / LAST CHANCE, GOOD VIBES</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="72.875313" transform="rotate(-0 36.936 72.875313)">Setter generosity is encouraged; dinner and costumes remain opt-in</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="481.024238" transform="rotate(-0 36.936 481.024238)">FIRST TO FOUR  /  Original house-rule illustration  /  Schematic, not official court dimensions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="164.16" y="135.88053" transform="rotate(-0 164.16 135.88053)">FINAL E AT STAKE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(86.834297 168.34373)">Setter may generously offer</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(116.315156 182.750895)">a mercy attempt.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="432" y="135.88053" transform="rotate(-0 432 135.88053)">ACCEPT OR DECLINE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(355.696953 168.34373)">No pressure to extend play;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(351.833203 182.750895)">respect personal boundaries.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="699.84" y="135.88053" transform="rotate(-0 699.84 135.88053)">IF OUT</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(625.085547 168.34373)">Leave the active play area.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(623.956328 182.750895)">Last remaining player wins.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="699.84" y="278.29653" transform="rotate(-0 699.84 278.29653)">HORSE DINNER JOKE</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(611.718828 310.75973)">Most mercies: dinner for others,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(625.953516 325.166895)">win or lose; voluntary only.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="432" y="278.29653" transform="rotate(-0 432 278.29653)">BAD VIBES BETTY</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(345.204844 310.75973)">Tiara · purple lipstick · miniskirt</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(346.313438 325.166895)">ONLY a mutually agreed opt-in.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="164.16" y="278.29653" transform="rotate(-0 164.16 278.29653)">NO COERCION</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(93.071641 310.75973)">Declining is not a penalty.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(103.279297 325.166895)">No forced humiliation.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(220.710938 413.052797)">Shooting has a different dinner convention: usually dinner for loser(s).</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(239.959688 428.769703)">Do not collapse these jokes into a single enforceable obligation.</text>
   </g>
  </g>
