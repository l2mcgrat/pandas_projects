   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="481.024238" transform="rotate(-0 36.936 481.024238)">FIRST TO FOUR  /  Original house-rule illustration  /  Schematic, not official court dimensions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="432" y="142.691731" transform="rotate(-0 432 142.691731)">3 attempts per player at each Backboard location</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="334.908" y="204.195925" transform="rotate(-0 334.908 204.195925)">1</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="432" y="204.195925" transform="rotate(-0 432 204.195925)">2</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="529.092" y="204.195925" transform="rotate(-0 529.092 204.195925)">3</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="170.856" y="294.85653" transform="rotate(-0 170.856 294.85653)">MAKE</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(101.337719 327.31973)">Wait for the other player;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(107.550141 341.726895)">all make → move back.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="432" y="294.85653" transform="rotate(-0 432 294.85653)">BUDGET USED</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(369.862891 327.31973)">Mercy may be offered;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(374.691719 341.726895)">receiver can decline.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="693.144" y="294.85653" transform="rotate(-0 693.144 294.85653)">BOTH FAIL</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(630.572047 327.31973)">Agree mutual mercies;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(627.235953 341.726895)">typically two, not a cap.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(165.135703 416.74373)">No accepted mercies left? HIGH JUMP RULES compares attempts at the previous successful shot.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(173.467344 431.150895)">Unlimited mercy offers are hospitality, not extra attempts automatically added to the budget.</text>
   </g>
