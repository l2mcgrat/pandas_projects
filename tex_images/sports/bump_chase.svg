   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="318.168" y="135.803313" transform="rotate(-0 318.168 135.803313)">SECOND</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="606.096" y="142.50453" transform="rotate(-0 606.096 142.50453)">SECOND MAKES FIRST</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(536.631859 174.96773)">First player is eliminated.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(517.931859 189.374895)">Stop targeting their ball/person.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="606.096" y="281.34357" transform="rotate(-0 606.096 281.34357)">FIRST MAKES FIRST</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(518.692406 313.492148)">Pass to the next queued player,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(519.015531 327.899313)">who becomes second. With two</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(543.830844 342.306477)">remaining, swap roles.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183047" x="432" y="450.443312" transform="rotate(-0 432 450.443312)">Rebounds: shoot from anywhere. Single-knockout explanation ≠ a definition of logged ‘5-x’ scores.</text>
