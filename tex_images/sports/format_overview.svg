   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="72.875313" transform="rotate(-0 36.936 72.875313)">Two players · up to seven challenges · play order is not a preset playlist</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536775" x="36.936" y="481.024238" transform="rotate(-0 36.936 481.024238)">FIRST TO FOUR  /  Original house-rule illustration  /  Schematic, not official court dimensions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="164.16" y="135.88053" transform="rotate(-0 164.16 135.88053)">AGREE BEFORE PLAY</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(86.120156 168.34373)">Safety · first picker · repeats</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(94.367578 182.750895)">markers · unresolved ties</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="432" y="135.88053" transform="rotate(-0 432 135.88053)">PLAY A CHALLENGE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(367.424844 168.34373)">Shooting / HORSE / 1v1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(341.0025 182.750895)">Backboard / 3 Point / Rim / Bump</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="699.84" y="135.88053" transform="rotate(-0 699.84 135.88053)">RECORD ONE WIN</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(643.617969 168.34373)">L = Liam; O = Owen</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(619.764297 182.750895)">Record winners in play order.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="699.84" y="278.29653" transform="rotate(-0 699.84 278.29653)">FOUR WINS?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(649.845 310.75973)">Yes → series ends.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(625.828906 325.166895)">No → winner chooses next.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="432" y="278.29653" transform="rotate(-0 432 278.29653)">NEXT PICK</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(362.412969 310.75973)">Previous winner chooses;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(353.269219 325.166895)">actual choices need logging.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="164.16" y="278.29653" transform="rotate(-0 164.16 278.29653)">REPEAT UNTIL CLINCH</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(72.458672 310.75973)">At most seven in two-player play.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(80.052109 325.166895)">Do not add post-clinch games.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(172.62 413.052797)">Observed Shooting openings do not prove a fixed first game. Repeats are unspecified.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(192.130313 428.769703)">The next pick is a story hook, not evidence that choosing causes an advantage.</text>
   </g>
