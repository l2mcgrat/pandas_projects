   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #b75016" transform="translate(155.062109 438.60293)">NO human targets, including resting/eliminated/on-phone people. Stop and give first aid for contact.</text>
