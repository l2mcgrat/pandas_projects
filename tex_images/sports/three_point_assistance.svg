   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(548.035516 178.27973)">Return rebounds safely.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(535.129422 192.686895)">Do not interfere with a shot.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="612.792" y="285.51669" transform="rotate(-0 612.792 285.51669)">NO HELPER?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(533.945203 316.804148)">Self-rebound. Log assistance</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(526.984266 331.211313)">if comparing completion times.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(543.767 345.618477)">Help is never mandatory.</text>
   </g>
